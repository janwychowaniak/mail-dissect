name: release

# Publishes the image on a version tag. `latest` moves too, but it is not a contract - the
# version tag is (SPEC §21).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: The tag and pyproject.version must agree
        run: |
          python3 - <<'PY'
          import os, sys, tomllib, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              print(f"::error::tag {tag} does not match pyproject version {version}")
              sys.exit(1)
          print(f"tag {tag} matches pyproject version {version}")
          PY

      - name: The suite has to pass on the exact commit being published
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/mail-dissect"
          DOCKER_BUILDKIT=0 docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .

      # The base image is rebuilt under its tag, so this build may carry a newer Python than
      # the one CI tested. What is read out of a header is that interpreter's parser [D24], so
      # the pins run on the image about to be pushed, and nothing is pushed if they fail.
      - name: The header pins hold on the interpreter being published
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/mail-dissect"
          docker run --rm -v "$PWD/tests:/tests:ro" "$IMAGE:$VERSION" python /tests/pins.py

      - name: Push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/mail-dissect"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
