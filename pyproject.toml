[project]
name = "mail-dissect"
version = "0.1.0"
description = "Deterministic dissection of raw email messages over HTTP"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jan Wychowaniak" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/janwychowaniak/mail-dissect"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_dissect"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fuzz: the long fuzz run with a random seed (not part of the default suite)",
    "live: needs a real Tika or renderer container (never runs in CI)",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["src/mail_dissect"]
